<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Untitled, best mod menu for Gorilla Tag</title>
  <meta name="description" content="Untitled is a lightweight mod menu for Gorilla Tag with a clean in-game UI and the best overpowered mods.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
<div id="navbar-container"></div>
<script>
  function initBuyDropdown(){
    if (window.__buyInit) return;
    window.__buyInit = true;
    document.querySelectorAll('[data-buy]').forEach((el) => {
      const trigger = el.querySelector('.buy-trigger');
      if (!trigger) return;
      trigger.addEventListener('click', (e) => {
        e.stopPropagation();
        const open = el.dataset.open === 'true';
        document.querySelectorAll('[data-buy]').forEach((o) => { o.dataset.open = 'false'; if (o.querySelector('.buy-trigger')) o.querySelector('.buy-trigger').setAttribute('aria-expanded', 'false'); });
        if (!open) { el.dataset.open = 'true'; trigger.setAttribute('aria-expanded', 'true'); }
      });
    });
    document.addEventListener('click', () => {
      document.querySelectorAll('[data-buy]').forEach((o) => { o.dataset.open = 'false'; if (o.querySelector('.buy-trigger')) o.querySelector('.buy-trigger').setAttribute('aria-expanded', 'false'); });
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') document.querySelectorAll('[data-buy]').forEach((o) => { o.dataset.open = 'false'; if (o.querySelector('.buy-trigger')) o.querySelector('.buy-trigger').setAttribute('aria-expanded', 'false'); });
    });
  }

  function setActiveNav(){
    const container = document.getElementById('navbar-container');
    if (!container) return;
    const links = container.querySelectorAll('nav .links a');
    const current = location.href.split('/').pop().split('?')[0].split('#')[0] || 'index.html';
    links.forEach(a => {
      const href = a.getAttribute('href');
      if (!href) return a.removeAttribute('aria-current');
      const name = href.split('/').pop();
      if (name.toLowerCase() === current.toLowerCase() || (name === 'index.html' && current === '')) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
  }

  fetch('./navbar.html')
    .then(r => r.text())
    .then(html => {
      document.getElementById('navbar-container').innerHTML = html;
      initBuyDropdown();
      setActiveNav();
    });
</script>


  <main class="center">
    <div class="hero">
      <div>
        <h1>Untitled</h1>
        <p class="tagline">The best mod menu for Gorilla&nbsp;Tag</p>
        <p class="sub">Optimized, fast, &amp; safe. Everything a mod menu needs.</p>
        <div class="cta-row">
          <div class="buy" data-buy>
            <button type="button" class="btn btn-primary buy-trigger" aria-haspopup="menu" aria-expanded="false">
              Purchase Untitled <i class="fa-solid fa-chevron-down"></i>
            </button>
            <div class="buy-menu" role="menu">
              <a href="https://store.reseller.best/product/untitled" role="menuitem">
                <span class="icon"><i class="fa-solid fa-bolt"></i></span>
                <span class="label"><strong>Untitled</strong><span>Stable</span></span>
              </a>
              <a href="https://store.reseller.best/product/untitled-beta-access" role="menuitem">
                <span class="icon"><i class="fa-solid fa-flask"></i></span>
                <span class="label"><strong>Untitled (Beta)</strong><span>Access features early</span></span>
              </a>
            </div>
          </div>
          <a class="btn btn-ghost" href="features.html">See features</a>
        </div>
      </div>
      <img src="menuAssets/Untitled.png" alt="Untitled Logo">
    </div>

    <section class="showcases">
      <h2>Showcases</h2>
      <div class="marquee"><div class="marquee-track" id="marquee-a"></div></div>
      <div class="marquee reverse"><div class="marquee-track" id="marquee-b"></div></div>
    </section>

  </main>

  <footer>
    <div class="foot-inner">
      <div class="socials">
        <a href="https://discord.gg/untitledmenu" aria-label="Discord"><i class="fa-brands fa-discord"></i></a>
        <a href="https://youtube.com/shibagtag" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
      </div>
      <div class="links">
        <a href="privacy.html">Privacy Policy</a>
        <a href="https://discord.com/terms">Discord ToS</a>
      </div>
    </div>
  </footer>

  <!-- buy dropdown is initialized after navbar injection -->
  <script>
    (function(){
      const showcases = [
        { "id": "V5RtXuj6d9k", "caption": "Review" },
        { "id": "Oz5-sTU6Sy0", "caption": "Review" },
        { "id": "iAQ1T8tlzHY", "caption": "Review" },
        { "id": "IC8rqK4skV8", "caption": "Trolling" },
        { "id": "9AOAyYzEc8o", "caption": "Trolling" },
        { "id": "Zv5Wp_IGA20", "caption": "Review" },
      ];
      function tile(v) {
        const thumb = `https://img.youtube.com/vi/${v.id}/hqdefault.jpg`;
        return `<div class="showcase" data-yt="${v.id}">
          <img src="${thumb}" alt="${v.caption}" loading="lazy">
          <div class="play-btn"><i class="fa-solid fa-play"></i></div>
          <div class="caption"><i class="fa-brands fa-youtube"></i>${v.caption}</div>
        </div>`;
      }
      const half = Math.ceil(showcases.length / 2);
      const a = showcases.slice(0, half);
      const b = showcases.slice(half);
      const dup = (arr) => arr.concat(arr).map(tile).join('');
      const aEl = document.getElementById('marquee-a');
      const bEl = document.getElementById('marquee-b');
      if (aEl) aEl.innerHTML = dup(a);
      if (bEl) bEl.innerHTML = dup(b);

      // attach play handlers
      function attachHandlers(root){
        root.querySelectorAll('.showcase[data-yt]').forEach((el) => {
          const btn = el.querySelector('.play-btn');
          if (!btn) return;
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = el.dataset.yt;
            const src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=0&loop=1&playlist=${id}&controls=1&modestbranding=1&rel=0&playsinline=1`;
            el.innerHTML = `<iframe src="${src}" title="" frameborder="0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen style="pointer-events:auto"></iframe>`;
          });
        });
      }
      if (aEl) attachHandlers(aEl);
      if (bEl) attachHandlers(bEl);
    })();
  </script>
</body>
</html>
